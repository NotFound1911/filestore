<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册成功</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      text-align: center;
      padding-top: 100px;
    }
    .success-box {
      width: 300px;
      margin: auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .success-box h2 {
      margin-bottom: 20px;
      color: #4CAF50;
    }
    .success-box button {
      padding: 10px 20px;
      background-color: #008CBA;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 20px;
    }
    .success-box button:hover {
      background-color: #005f7a;
    }
  </style>
</head>
<body>
<div class="success-box">
  <h2>注册成功！</h2>
  <p>感谢您注册。现在您可以返回登录页面进行登录。</p>
  <button onclick="location.href='/'">返回登录页面</button>
</div>
</body>
</html>
