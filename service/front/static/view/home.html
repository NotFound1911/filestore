<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile and File List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .profile {
      margin-bottom: 20px;
    }
    .file-list {
      margin-bottom: 20px;
    }
    .file-item {
      margin-bottom: 10px;
    }
    button {
      margin-right: 10px;
    }
  </style>
</head>
<body>
<div class="profile">
  <h2>User Profile</h2>
  <p><strong>Email:</strong> <span id="userEmail"></span></p>
</div>

<div class="file-list">
  <h2>File List</h2>
  <div id="fileList"></div>
</div>

<button id="uploadButton">Upload File</button>

<script>
  // Function to fetch user profile information
  function fetchUserProfile() {
    fetch('http://localhost:8080/profile')
            .then(response => response.json())
            .then(data => {
              if (data.code === 2000) {
                document.getElementById('userEmail').textContent = data.data.email;
              } else {
                console.error('Error fetching profile:', data.msg);
              }
            })
            .catch(error => console.error('Error fetching profile:', error));
  }

  // Function to fetch user's file list
  function fetchFileList() {
    fetch('http://localhost:8080/list')
            .then(response => response.json())
            .then(data => {
              const fileListDiv = document.getElementById('fileList');
              fileListDiv.innerHTML = ''; // Clear previous list

              data.forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.classList.add('file-item');
                fileItem.innerHTML = `<span>${file.name}</span> <button onclick="downloadFile('${file.id}')">Download</button>`;
                fileListDiv.appendChild(fileItem);
              });
            })
            .catch(error => console.error('Error fetching file list:', error));
  }

  // Function to handle file download
  function downloadFile(fileId) {
    // Assuming fileId is used to download the file
    window.open(`https://api.example.com/download/${fileId}`, '_blank');
  }

  // Event listener for upload button
  document.getElementById('uploadButton').addEventListener('click', () => {
    // Implement your upload functionality here, e.g., open a modal or redirect to upload page
    alert('Implement your upload functionality here.');
  });

  // Fetch user profile and file list on page load
  document.addEventListener('DOMContentLoaded', () => {
    fetchUserProfile();
    fetchFileList();
  });
</script>
</body>
</html>
