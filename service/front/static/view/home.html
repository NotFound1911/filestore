<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile and File List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .profile {
      margin-bottom: 20px;
    }
    .file-list {
      margin-bottom: 20px;
    }
    button {
      margin-right: 10px;
    }
    .file-item {
      display: flex; /* 使用 Flex 布局使得下载按钮能够在条目右边 */
      align-items: center; /* 垂直居中对齐 */
      justify-content: space-between; /* 在条目内部右对齐 */
      margin-bottom: 8px; /* 设置文件条目之间的间距 */
      font-family: Arial, sans-serif; /* 设置字体 */
      font-size: 14px; /* 设置字体大小 */
      color: #333; /* 设置文本颜色 */
      background-color: #f0f0f0; /* 设置背景颜色 */
      padding: 8px; /* 设置内边距 */
      border-radius: 4px; /* 设置圆角 */
    }

    .file-item.highlight {
      font-weight: bold; /* 设置高亮文本的粗体 */
      color: #007bff; /* 设置高亮文本的颜色，这里使用蓝色 */
    }

    .download-btn {
      padding: 6px 12px; /* 按钮内边距 */
      background-color: #007bff; /* 按钮背景色 */
      color: white; /* 按钮文字颜色 */
      border: none; /* 去掉按钮边框 */
      border-radius: 4px; /* 按钮圆角 */
      cursor: pointer; /* 鼠标指针样式设为手型 */
    }
  </style>
</head>
<body>
<div class="profile">
  <h2>User Profile</h2>
  <p><strong>Email:</strong> <span id="userEmail"></span></p>
</div>

<div id="fileList">
  <!-- File items will be added here dynamically -->
</div>
<input type="file" id="fileInput">
<button id="uploadButton">Upload File</button>

<script>
  // Function to fetch user profile information
  function fetchUserProfile() {
    fetch('http://localhost:8080/profile')
            .then(response => response.json())
            .then(data => {
              if (data.code === 2000) {
                document.getElementById('userEmail').textContent = data.data.email;
              } else {
                console.error('Error fetching profile:', data.msg);
              }
            })
            .catch(error => console.error('Error fetching profile:', error));
  }

  function fetchFileList() {
    fetch('http://localhost:8080/list')
            .then(response => response.json())
            .then(data => {
              const fileListDiv = document.getElementById('fileList');
              fileListDiv.innerHTML = ''; // Clear previous list

              if (data.code === 2000) { // Check if response code is 2000 (success)
                const files = data.data; // Access the 'data' array in the response

                files.forEach(file => {
                  const fileItem = document.createElement('div');
                  fileItem.classList.add('file-item'); // Add 'file-item' class

                  // Format size to include 'KB' suffix
                  const fileSize = `${file.size}KB`;

                  // Create a friendly display format with highlighted parts
                  const displayText = `sha1:<span class="highlight">${file.sha1}</span>   path: /<span class="highlight">${file.bucket}/${file.file_name}</span>   size: <span class="highlight">${fileSize}</span>`;

                  fileItem.innerHTML = displayText;

                  // Create download button
                  const downloadBtn = document.createElement('button');
                  downloadBtn.textContent = 'Download';
                  downloadBtn.classList.add('download-btn');
                  downloadBtn.addEventListener('click', function() {
                    // Call function to initiate POST request
                    initiatePostRequest(file.sha1, file.file_name);
                  });

                  fileItem.appendChild(downloadBtn);
                  fileListDiv.appendChild(fileItem);
                });
              } else {
                console.error('Error fetching file list:', data.msg); // Log error message if response code is not 2000
              }
            })
            .catch(error => console.error('Error fetching file list:', error));
  }
  function initiatePostRequest(sha1, fileName) {
    // Prepare POST request data
    const postData = {
      file_sha1: sha1,
      file_name: fileName
    };

    // Fetch POST request
    fetch('/download', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(postData)
    })
            .then(response => {
              if (!response.ok) {
                throw new Error('Network response was not ok');
              }
              return response.blob(); // Get the response as a Blob
            })
            .then(blob => {
              // Create a temporary URL for the blob data
              const url = window.URL.createObjectURL(blob);
              // Create a link element
              const link = document.createElement('a');
              link.style.display = 'none';
              link.href = url;
              link.setAttribute('download', fileName); // Set the download attribute
              // Append the link to the body
              document.body.appendChild(link);
              // Programmatically click the link to trigger the download
              link.click();
              // Clean up: remove the link and revoke the URL object
              document.body.removeChild(link);
              window.URL.revokeObjectURL(url);
            })
            .catch(error => console.error('Error initiating download:', error));
  }


  fetchFileList(); // Fetch file list when the page loads

  document.getElementById('uploadButton').addEventListener('click', () => {
    let formData = new FormData();
    let fileInput = document.getElementById('fileInput');
    formData.append('file', fileInput.files[0]);

    fetch('/upload', {
      method: 'POST',
      body: formData
    })
            .then(response => {
              if (!response.ok) {
                throw new Error('Network response was not ok');
              }
              return response.json();
            })
            .then(data => {
              console.log('Upload successful:', data);
              // Handle successful upload, e.g., show success message or update UI
            })
            .catch(error => {
              console.error('Error during upload:', error);
              // Handle error, e.g., show error message or log to console
            });
  });


  // Fetch user profile and file list on page load
  document.addEventListener('DOMContentLoaded', () => {
    fetchUserProfile();
    fetchFileList();
  });
</script>
</body>
</html>
