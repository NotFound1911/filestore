<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile and File List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .profile {
      margin-bottom: 20px;
    }
    .file-list {
      margin-bottom: 20px;
    }
    button {
      margin-right: 10px;
    }
    .file-item {
      display: flex; /* 使用 Flex 布局使得下载按钮能够在条目右边 */
      align-items: center; /* 垂直居中对齐 */
      justify-content: space-between; /* 在条目内部右对齐 */
      margin-bottom: 8px; /* 设置文件条目之间的间距 */
      font-family: Arial, sans-serif; /* 设置字体 */
      font-size: 14px; /* 设置字体大小 */
      color: #333; /* 设置文本颜色 */
      background-color: #f0f0f0; /* 设置背景颜色 */
      padding: 8px; /* 设置内边距 */
      border-radius: 4px; /* 设置圆角 */
    }

    .file-item.highlight {
      font-weight: bold; /* 设置高亮文本的粗体 */
      color: #007bff; /* 设置高亮文本的颜色，这里使用蓝色 */
    }

    .download-btn {
      padding: 6px 12px; /* 按钮内边距 */
      background-color: #007bff; /* 按钮背景色 */
      color: white; /* 按钮文字颜色 */
      border: none; /* 去掉按钮边框 */
      border-radius: 4px; /* 按钮圆角 */
      cursor: pointer; /* 鼠标指针样式设为手型 */
    }
  </style>
</head>
<body>
<div class="profile">
  <h2>User Profile</h2>
  <p><strong>Email:</strong> <span id="userEmail"></span></p>
</div>

<div id="fileList">
  <!-- File items will be added here dynamically -->
</div>

<button id="uploadButton">Upload File</button>

<script>
  // Function to fetch user profile information
  function fetchUserProfile() {
    fetch('http://localhost:8080/profile')
            .then(response => response.json())
            .then(data => {
              if (data.code === 2000) {
                document.getElementById('userEmail').textContent = data.data.email;
              } else {
                console.error('Error fetching profile:', data.msg);
              }
            })
            .catch(error => console.error('Error fetching profile:', error));
  }

  function fetchFileList() {
    fetch('http://localhost:8080/list')
            .then(response => response.json())
            .then(data => {
              const fileListDiv = document.getElementById('fileList');
              fileListDiv.innerHTML = ''; // Clear previous list

              if (data.code === 2000) { // Check if response code is 2000 (success)
                const files = data.data; // Access the 'data' array in the response

                files.forEach(file => {
                  const fileItem = document.createElement('div');
                  fileItem.classList.add('file-item'); // Add 'file-item' class

                  // Format size to include 'KB' suffix
                  const fileSize = `${file.size}KB`;

                  // Create a friendly display format with highlighted parts
                  const displayText = `sha1:<span class="highlight">${file.sha1}</span>   path: /<span class="highlight">${file.bucket}/${file.file_name}</span>   size: <span class="highlight">${fileSize}</span>`;

                  fileItem.innerHTML = displayText;

                  // Create download button
                  const downloadBtn = document.createElement('button');
                  downloadBtn.textContent = 'Download';
                  downloadBtn.classList.add('download-btn');
                  downloadBtn.addEventListener('click', function() {
                    downloadFile(file.sha1);
                  });

                  fileItem.appendChild(downloadBtn);
                  fileListDiv.appendChild(fileItem);
                });
              } else {
                console.error('Error fetching file list:', data.msg); // Log error message if response code is not 2000
              }
            })
            .catch(error => console.error('Error fetching file list:', error));
  }

  function downloadFile(sha1) {
    // Prepare download request
    const downloadUrl = `http://localhost:8888/api/storage/v1/file/download?sha1=${sha1}`;
    window.open(downloadUrl, '_blank'); // Open download URL in a new tab/window
  }

  fetchFileList(); // Fetch file list when the page loads

  // Event listener for upload button
  document.getElementById('uploadButton').addEventListener('click', () => {
    // Implement your upload functionality here, e.g., open a modal or redirect to upload page
    alert('Implement your upload functionality here.');
  });

  // Fetch user profile and file list on page load
  document.addEventListener('DOMContentLoaded', () => {
    fetchUserProfile();
    fetchFileList();
  });
</script>
</body>
</html>
